    var _injected = {};

    function injectJs(pathToJsFile, callback) {
      if (_injected[pathToJsFile]) {
        if (callback) callback("Already injected: " + pathToJsFile);
        return;
      }
      _injected[pathToJsFile] = true;
      var scriptEl = document.createElement('script');

  <style>
    .flutter-loader, .loading.hidden { display: none; }

    @media only screen and (orientation: landscape) {
      :root {
        --size0: 30vh;
      }
    }

    @media only screen and (orientation: portrait) {
      :root {
        --size0: 25vw;
      }
    }

    :root {
      --bkColor: #f4f2ef;
      --frColor: #f4f2ef;
      --circleDiam: calc(var(--size0) * 0.5); /* circle needed to overcome Chrome box-shadow shape bug */
      --circleRadius: calc(var(--circleDiam) / 2.0);
      --spreadBase: calc(var(--size0) * 0.25); /* (1 - 0.5) / 2 */
      --spread1: calc(var(--spreadBase) + 10px);
      --spread2: calc(var(--spreadBase) + 20px);
      --spread3: calc(var(--spreadBase) + 30px);
      --sliderWidth: calc(var(--size0) * 2.2);
    }

    html, body {
      margin: 0;
      background: var(--bkColor);
    }

    .loading {
      position: absolute;
      top: 45%;
      left: 45%;
      margin: -20px 0 0 -20px;
      width: 40px;
      line-height: 40px;
    }

    .loading h1 {
      font-size: 50px;
      font-family: "Arial";
      color: white;
      text-shadow: 4px 4px 0 #ff0000, 2px 3px 15px rgba(0, 0, 0, 0.5);
    }

    /* By adding before & after at the end of the class allows the computer to identify and differentiate */
    .loading span, .loading span:before, .loading span:after {
      display: block;
      /* This will add a block shape */
      width: 2px;
      height: 2px;
      border-radius: 1px;
      /*border: 1px solid red;*/
      animation: rip 5s infinite;
    }

    .loading span {
      position: absolute;
      z-index: -1; /* This will place the ripple behind the text */
      top: 40px;
      left: 15px;
    }

    .loading span:before, .loading span:after {
      content: "";
      position: absolute;
    }

    .loading span:before {
      animation-delay: 0.2s;
      top: 5px;
      left: 25px;
    }

    .loading span:after {
      animation-delay: 0.8s;
      top: 25px;
      left: 0;
    }

    @keyframes rip {
      0% {
        box-shadow: 0 0 0 0 transparent, 0 0 0 0 transparent,
                    0 0 0 0 transparent, 0 0 0 0 transparent;
      }
      5% {
        box-shadow: 0 0 0 0 var(--frColor), 0 0 0 0 rgba(255, 255, 255, 0.4),
                    0 0 0 0 var(--frColor), 0 0 0 0 rgba(0, 0, 0, 0.08);
      }
      100% {
        width: var(--circleDiam);
        height: var(--circleDiam);
        border-radius: var(--circleRadius);
        box-shadow: 0 0 40px var(--spreadBase) var(--frColor), 0 0 10px var(--spread1) transparent,
                    0 0 30px var(--spread2) var(--frColor), 0 0 5px var(--spread3) transparent;
      }
    }

    .loading .slider {
      position: absolute;
      width: var(--sliderWidth);
      height: 4px;
      margin-top: calc(var(--size0) * 1.3);
      margin-left: calc(var(--size0) * -0.9);
    }

    .loading .line {
      position: absolute;
      background: rgba(0, 0, 0, 0.08); /*#4a8df8;*/
      width: var(--sliderWidth);
      height: 4px;
    }

    .loading .break {
      position: absolute;
      background: var(--frColor); /*#222;*/
      width: 6px;
      height: 4px;
    }

    .loading .dot1{ animation: loading_anim 2s infinite;}
    .loading .dot2{ animation: loading_anim 2s 0.5s infinite; }
    .loading .dot3{ animation: loading_anim 2s 1s infinite; }

    @keyframes loading_anim {
      from { margin-left: 0; }
      to { margin-left: var(--sliderWidth); }
    }
  </style>
