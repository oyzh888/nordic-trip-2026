<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>打包清单 · 北欧 2026</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F0E0C">
<link rel="stylesheet" href="/style.css">
<style>
/* 这一页和站里其他页不同：它是**在手机上单手边收东西边点**的，
   所以点击目标要大（≥48px 高）、字要够、勾完要明显。 */
/* 🔴 全站 style.css 里是 body{overflow-x:hidden} —— 那会让 body 变成滚动容器，
   **position:sticky 整站失效**（导航其实一直没真吸顶，只是没人注意）。
   overflow-x:clip 同样挡住横向溢出，但**不**创建滚动容器 → sticky 恢复。
   只在这一页覆盖：这页是边收东西边滚着勾的，进度条必须一直看得见。 */
body{overflow-x:clip}
.pk{max-width:760px}
.batch{margin:26px 0 0}
.batch h2{font-size:clamp(19px,2.2vw,23px);margin:0 0 2px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.batch .when{font:600 12px/1 var(--mono);letter-spacing:.06em;color:var(--acc);
  border:1px solid currentColor;border-radius:999px;padding:5px 9px;white-space:nowrap}
.batch .why{color:var(--ink2);font-size:14.5px;margin:6px 0 12px}
ul.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair)}
ul.items li{border-bottom:1px solid var(--hair)}
label.it{display:flex;gap:13px;align-items:flex-start;padding:13px 4px;min-height:48px;
  cursor:pointer;-webkit-tap-highlight-color:transparent}
label.it input{appearance:none;flex:0 0 auto;width:23px;height:23px;margin:1px 0 0;border-radius:6px;
  border:1.5px solid var(--hair2);background:transparent;cursor:pointer;position:relative;transition:.16s}
label.it input:checked{background:var(--acc);border-color:var(--acc)}
label.it input:checked::after{content:'';position:absolute;left:7px;top:3px;width:6px;height:11px;
  border:solid #0F0E0C;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
label.it input:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
label.it .tx{flex:1;min-width:0;line-height:1.45}
label.it .tx .n{display:block;color:var(--ink2);font-size:13px;margin-top:3px}
label.it input:checked ~ .tx{color:var(--ink3)}
label.it input:checked ~ .tx b{color:var(--ink3);font-weight:600}
label.it input:checked ~ .tx .n{color:var(--ink3);opacity:.7}
/* 进度条：吸在视口顶端，随时知道还剩多少。
   ⚠️ 不要按导航高度做偏移 —— 站里的导航**本身不吸顶**（见上面那条 overflow 的注释，
   它是 .nav 自己的问题），偏移只会在滚动时留出一条空白。 */
.prog{position:sticky;top:0;z-index:40;background:rgba(15,14,12,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--hair);margin:0 0 4px}
.prog .in{max-width:760px;margin:0 auto;padding:11px clamp(16px,4vw,28px) 12px;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.prog .bar{flex:1;min-width:120px;height:6px;border-radius:99px;background:var(--panel2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.prog .num{font:700 15px/1 var(--mono);white-space:nowrap}
.prog .sync{font:500 11.5px/1 var(--mono);color:var(--ink3);white-space:nowrap}
.prog .sync.on{color:var(--acc)}
.prog .sync.err{color:#D98859}
.tools{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0 0}
.tools button{font:600 13px/1 var(--sans);color:var(--ink2);background:transparent;
  border:1px solid var(--hair2);border-radius:999px;padding:9px 14px;cursor:pointer}
.tools button:hover{color:var(--ink);border-color:var(--acc)}
.done .batch{opacity:.45}
@media(max-width:520px){label.it{padding:14px 2px}}
</style>
</head>
<body>

<div class="prog"><div class="in">
  <span class="num" id="num">0 / 0</span>
  <span class="bar"><i id="bar"></i></span>
  <span class="sync" id="sync">···</span>
</div></div>

  <div class="wrap pk">
    <div class="eyebrow">9/23 出发前 · 60–75 分钟</div>
    <h1 style="margin-bottom:14px">打包清单</h1>
    <p class="lede">顺序不是按物品分类排的，是<b>按「忘了有多贵」排的</b> ——
      最上面那批是店会关门、过了今天就补不上的；最下面那批随时能买，时间不够就砍。
      <b>先把会「等」的启动（洗衣机 / 充电 / 下地图），再做要「手」的。</b></p>
    <p class="lede s">勾选状态存在云端 —— <b>手机和电脑上都能点，会互相同步</b>。
      同一条以后勾的为准，所以两台设备同时开着也不会互相抹掉。</p>
    <div class="tools">
      <button id="hide">隐藏已完成</button>
      <button id="pull">立刻同步</button>

  </div>
</section>

<section><div class="wrap pk" id="list"></div></section>

/* ==================================================================
   同步层
   为什么不是 localStorage / cookie：那是**按设备**存的，手机上勾的电脑看不到。
   这里两层都用 —— 本机 localStorage 保证离线/断网也能勾（收东西时网可能不稳），
   云端 KV 负责跨设备。合并规则：**同一条取时间戳更晚的**，所以两台设备同时开着
   也不会互相抹掉（不是整份覆盖）。
   ================================================================== */
const LS = 'pack:v1';
let state = {};                 // { id: {c:bool, t:ms} }
let dirty = false;

const load = () => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch { return {}; } };
const save = () => { try { localStorage.setItem(LS, JSON.stringify(state)); } catch {} };

function mergeIn(incoming) {
  let changed = false;
  for (const [id, v] of Object.entries(incoming || {})) {
    if (!v || typeof v.t !== 'number') continue;
    if (!state[id] || v.t > state[id].t) { state[id] = { c: !!v.c, t: v.t }; changed = true; }
  }
  return changed;
}

const sync = document.getElementById('sync');
const setSync = (txt, cls = '') => { sync.textContent = txt; sync.className = 'sync ' + cls; };

async function pull() {
  try {
    const r = await fetch('/api/pack', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (mergeIn(d.items)) { save(); render(); }
    setSync('已同步 ' + new Date().toTimeString().slice(0, 5), 'on');
  } catch { setSync('离线（本机已存）', 'err'); }
}

let pushTimer = null;
function push() {
  dirty = true;
  setSync('保存中…');
  clearTimeout(pushTimer);
  // 防抖：连着勾五条只发一次请求
  pushTimer = setTimeout(async () => {
    try {
      const r = await fetch('/api/pack', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ items: state }),
      });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      mergeIn(d.items); save(); render();
      dirty = false;
      setSync('已同步 ' + new Date().toTimeString().slice(0, 5), 'on');
    } catch { setSync('离线（本机已存）', 'err'); }
  }, 700);
}

/* ---------- 渲染 ---------- */
const ALL = BATCHES.flatMap(b => b.items.map(i => i[0]));
function render() {
  const done = ALL.filter(id => state[id] && state[id].c).length;
  document.getElementById('num').textContent = `${done} / ${ALL.length}`;
  document.getElementById('bar').style.width = (done / ALL.length * 100) + '%';
  document.querySelectorAll('input[data-id]').forEach(el => {
    el.checked = !!(state[el.dataset.id] && state[el.dataset.id].c);
  });
  document.querySelectorAll('.batch').forEach(sec => {
    const ids = [...sec.querySelectorAll('input[data-id]')].map(e => e.dataset.id);
    sec.classList.toggle('alldone', ids.every(id => state[id] && state[id].c));
  });
}

document.getElementById('list').innerHTML = BATCHES.map(b => `
  <div class="batch" data-hue="${b.acc}">
    <h2>${b.t}<span class="when">${b.when}</span></h2>
    ${b.why ? `<p class="why">${b.why}</p>` : ''}
    <ul class="items">${b.items.map(([id, tx, note]) => `
      <li><label class="it">
        <input type="checkbox" data-id="${id}">
        <span class="tx">${tx}${note ? `<span class="n">${note}</span>` : ''}</span>
      </label></li>`).join('')}</ul>
  </div>`).join('');

document.getElementById('list').addEventListener('change', e => {
  const el = e.target.closest('input[data-id]');
  if (!el) return;
  state[el.dataset.id] = { c: el.checked, t: Date.now() };
  save(); render(); push();
});

document.getElementById('hide').addEventListener('click', e => {
  const on = document.body.classList.toggle('hidedone');
  e.target.textContent = on ? '显示全部' : '隐藏已完成';
  document.querySelectorAll('ul.items li').forEach(li => {
    const el = li.querySelector('input[data-id]');
    li.style.display = (on && el.checked) ? 'none' : '';
  });
});
document.getElementById('pull').addEventListener('click', pull);

state = load();
render();
chrome();
pull();
/* 回到这个页面时拉一次（在另一台设备上勾过的会出现）。
   ⚠️ KV 是最终一致的，跨地区最多约 60 秒 —— 合并是按条目的，所以只会「晚点看到」，不会丢。 */
document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
setInterval(() => { if (!document.hidden && !dirty) pull(); }, 20000);
</script>

.batch.alldone h2,.batch.alldone .why{opacity:.5}
body.hidedone .batch.alldone ul.items{display:none}
</style>
